services:

  # =========================
  # Kafka
  # =========================
  kafka:
    image: apache/kafka:4.0.1
    container_name: enerwise-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


  # =========================
  # Hadoop NameNode
  # =========================
  namenode:
    image: apache/hadoop:3.4.3
    container_name: enerwise-namenode
    hostname: namenode
    user: root

    command: >
      bash -c "
      if [ ! -f /opt/hadoop/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force;
      fi;
      hdfs namenode
      "

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      HADOOP_HOME: /opt/hadoop
      HDFS_NAMENODE_USER: root
      HDFS_DATANODE_USER: root
      HDFS_SECONDARYNAMENODE_USER: root

    volumes:
      - namenode_data:/opt/hadoop/dfs/name
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

    restart: unless-stopped


  # =========================
  # Hadoop DataNode
  # =========================
  datanode:
    image: apache/hadoop:3.4.3
    container_name: enerwise-datanode
    hostname: datanode
    user: root

    depends_on:
      - namenode

    command: >
      bash -c "
      hdfs datanode
      "

    ports:
      - "9864:9864"

    environment:
      HADOOP_HOME: /opt/hadoop
      HDFS_NAMENODE_USER: root
      HDFS_DATANODE_USER: root
      HDFS_SECONDARYNAMENODE_USER: root

    volumes:
      - datanode_data:/opt/hadoop/dfs/data
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

    restart: unless-stopped


    # =========================
  # Spark Master
  # =========================
  spark:
    image: apache/spark:4.0.1
    container_name: enerwise-spark
    hostname: spark

    depends_on:
      - kafka
      - namenode
      - datanode

    command: >
      /opt/spark/sbin/start-master.sh

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      # Spark Python code
      - ./spark:/opt/spark/work-dir

      # Hadoop configuration for HDFS access
      - ./hadoop-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml

    environment:
      SPARK_NO_DAEMONIZE: "true"
      SNOWFLAKE_ACCOUNT: "YOUR_ACCOUNT"
      SNOWFLAKE_USER: "YOUR_USER"
      SNOWFLAKE_PASSWORD: "${SNOWFLAKE_PASSWORD}"
      SNOWFLAKE_WAREHOUSE: "ENERWISE_WH"
      SNOWFLAKE_DATABASE: "ENERWISE"
      SNOWFLAKE_SCHEMA: "ANALYTICS"

    restart: unless-stopped


  # =========================
  # Spark Worker
  # =========================
  spark-worker:
    image: apache/spark:4.0.1
    container_name: enerwise-spark-worker
    hostname: spark-worker

    depends_on:
      - spark

    command: >
      /opt/spark/sbin/start-worker.sh spark://spark:7077

    volumes:
      # Same Spark code available to Worker
      - ./spark:/opt/spark/work-dir

      # Hadoop configuration for HDFS access
      - ./hadoop-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml

    environment:
      SPARK_NO_DAEMONIZE: "true"

    restart: unless-stopped


# =========================
# Docker Volumes
# =========================
volumes:
  kafka_data:
  namenode_data:
  datanode_data: